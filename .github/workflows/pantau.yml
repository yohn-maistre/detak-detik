name: Pantau Negara

# The keyless activity harvests, all lanes in one polite pass (§13.19):
# agenda istana (setkab + wapresri), lembaran negara (JDIH BPK), suara
# (dewan/aparat/partai/pengawas RSS). Deterministic, stdlib-only Python —
# runs even while NEWSROOM_ENABLED is false and the LLM lanes sleep.
# Replaces agenda.yml (wave 10a). Offset from the Newsroom crons.
on:
  schedule:
    - cron: '2 22 * * *'
    - cron: '2 10 * * *'
  workflow_dispatch:

jobs:
  panen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # stdlib only — no pip install, by design (see newsroom/pantau.py)
      - name: Panen semua lajur
        run: python -m newsroom.pantau
      - name: Commit arsip pantau
        run: |
          if [ -n "$(git status --porcelain newsroom/data/)" ]; then
            git config user.name "newsroom[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add newsroom/data/
            git commit -m "data: pantau negara (agenda + lembaran + suara)"
            git pull --rebase origin main || true
            git push || echo "push gagal; panen berikutnya mengulang"
          fi
