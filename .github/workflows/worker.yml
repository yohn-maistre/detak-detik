name: Deploy Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets belum diisi. Tambahkan CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID di repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the KV namespace id is resolved (or created) at deploy time so the
      # checked-in wrangler.toml never carries an account-specific id
      - name: Resolve KV namespace
        run: |
          ID=$(npx wrangler@4 kv namespace list 2>/dev/null | jq -r '.[] | select(.title | test("CACHE")) | .id' | head -1)
          if [ -z "$ID" ]; then
            OUT=$(npx wrangler@4 kv namespace create CACHE --config worker/wrangler.toml 2>&1 || true)
            ID=$(echo "$OUT" | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$ID" ]; then echo "::error::Gagal membuat/menemukan KV namespace"; exit 1; fi
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$ID/" worker/wrangler.toml
          echo "KV namespace: $ID"

      - name: Deploy worker
        run: npx wrangler@4 deploy --config worker/wrangler.toml

      - name: Push NIM_API_KEY secret
        env:
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
        run: |
          if [ -n "$NIM_API_KEY" ]; then
            echo "$NIM_API_KEY" | npx wrangler@4 secret put NIM_API_KEY --config worker/wrangler.toml
          else
            echo "NIM_API_KEY belum diisi, lewati."
          fi

      - name: Push TURNSTILE_SECRET secret
        env:
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          if [ -n "$TURNSTILE_SECRET" ]; then
            echo "$TURNSTILE_SECRET" | npx wrangler@4 secret put TURNSTILE_SECRET --config worker/wrangler.toml
          else
            echo "TURNSTILE_SECRET belum diisi, lewati."
          fi

      - name: Push EDISI_TOKEN secret
        env:
          EDISI_TOKEN: ${{ secrets.EDISI_TOKEN }}
        run: |
          if [ -n "$EDISI_TOKEN" ]; then
            echo "$EDISI_TOKEN" | npx wrangler@4 secret put EDISI_TOKEN --config worker/wrangler.toml
          else
            echo "EDISI_TOKEN belum diisi, lewati."
          fi

      - name: Push FIRMS_MAP_KEY secret
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -n "$FIRMS_MAP_KEY" ]; then
            echo "$FIRMS_MAP_KEY" | npx wrangler@4 secret put FIRMS_MAP_KEY --config worker/wrangler.toml
          else
            echo "FIRMS_MAP_KEY belum diisi, lewati."
          fi

      - name: Push WAQI_TOKEN secret
        env:
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
        run: |
          if [ -n "$WAQI_TOKEN" ]; then
            echo "$WAQI_TOKEN" | npx wrangler@4 secret put WAQI_TOKEN --config worker/wrangler.toml
          else
            echo "WAQI_TOKEN belum diisi, lewati."
          fi

      - name: Push OpenSky credentials
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: |
          if [ -n "$OPENSKY_CLIENT_ID" ] && [ -n "$OPENSKY_CLIENT_SECRET" ]; then
            echo "$OPENSKY_CLIENT_ID" | npx wrangler@4 secret put OPENSKY_CLIENT_ID --config worker/wrangler.toml
            echo "$OPENSKY_CLIENT_SECRET" | npx wrangler@4 secret put OPENSKY_CLIENT_SECRET --config worker/wrangler.toml
          else
            echo "OPENSKY creds belum diisi (pesawat pakai fallback adsb.lol), lewati."
          fi
