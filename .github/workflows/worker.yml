name: Deploy Worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

concurrency:
  group: worker-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Secrets belum diisi. Tambahkan CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID di repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the KV namespace id is resolved (or created) at deploy time so the
      # checked-in wrangler.toml never carries an account-specific id
      - name: Resolve KV namespace
        run: |
          ID=$(npx wrangler@4 kv namespace list 2>/dev/null | jq -r '.[] | select(.title | test("CACHE")) | .id' | head -1)
          if [ -z "$ID" ]; then
            OUT=$(npx wrangler@4 kv namespace create CACHE --config worker/wrangler.toml 2>&1 || true)
            ID=$(echo "$OUT" | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$ID" ]; then echo "::error::Gagal membuat/menemukan KV namespace"; exit 1; fi
          sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/$ID/" worker/wrangler.toml
          echo "KV namespace: $ID"

      - name: Deploy worker
        run: npx wrangler@4 deploy --config worker/wrangler.toml

      - name: Push NIM_API_KEY secret
        if: ${{ secrets.NIM_API_KEY != '' }}
        run: echo "${{ secrets.NIM_API_KEY }}" | npx wrangler@4 secret put NIM_API_KEY --config worker/wrangler.toml

      - name: Push TURNSTILE_SECRET secret
        if: ${{ secrets.TURNSTILE_SECRET != '' }}
        run: echo "${{ secrets.TURNSTILE_SECRET }}" | npx wrangler@4 secret put TURNSTILE_SECRET --config worker/wrangler.toml
