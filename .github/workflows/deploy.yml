name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Secrets belum diisi. Buka repo Settings -> Secrets and variables -> Actions, tambahkan CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID, lalu jalankan ulang workflow ini."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # repo Variable (Settings -> Secrets and variables -> Actions -> Variables):
          # AKSARA_URL = the worker URL, e.g. https://detak-detik-worker.<subdomain>.workers.dev
          PUBLIC_AKSARA_URL: ${{ vars.AKSARA_URL }}
          # repo Secret AISSTREAM_KEY -> exposed to the client for the ships layer
          # (browser WebSocket; the key is necessarily visible in the bundle, so
          # use a free best-effort AISStream key).
          PUBLIC_AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}

      # idempotent: creates the project on first run, no-ops after
      - name: Ensure Pages project exists
        run: npx wrangler@4 pages project create detak-detik --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=detak-detik --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
