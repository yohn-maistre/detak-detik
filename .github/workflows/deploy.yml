name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check Cloudflare secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Secrets belum diisi. Buka repo Settings -> Secrets and variables -> Actions, tambahkan CLOUDFLARE_API_TOKEN dan CLOUDFLARE_ACCOUNT_ID, lalu jalankan ulang workflow ini."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # the latest published edition is BAKED into the bundle: first paint is
      # the real paper (no contoh flash, no skeleton hang when the worker
      # host is unreachable from a reader's ISP); the runtime fetch upgrades
      - name: Bake latest edition into the bundle
        env:
          AKSARA: ${{ vars.AKSARA_URL || vars.PUBLIC_AKSARA_URL }}
        run: |
          if [ -n "$AKSARA" ]; then
            curl -sf --max-time 20 "$AKSARA/edisi" -o src/lib/data/edisi-baked.json \
              && echo "edisi terpanggang: $(head -c 80 src/lib/data/edisi-baked.json)" \
              || echo null > src/lib/data/edisi-baked.json
          fi
      - run: pnpm build
        env:
          # repo Variable (Settings -> Secrets and variables -> Actions -> Variables):
          # the variable is PUBLIC_AKSARA_URL today; AKSARA_URL kept as legacy alias
          PUBLIC_AKSARA_URL: ${{ vars.AKSARA_URL || vars.PUBLIC_AKSARA_URL }}
          # repo Secret AISSTREAM_KEY -> exposed to the client for the ships layer
          # (browser WebSocket; the key is necessarily visible in the bundle, so
          # use a free best-effort AISStream key).
          PUBLIC_AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}

      # idempotent: creates the project on first run, no-ops after
      - name: Ensure Pages project exists
        run: npx wrangler@4 pages project create detak-detik --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@4 pages deploy dist --project-name=detak-detik --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
