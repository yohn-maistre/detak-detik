name: Newsroom

# Two print runs a day, like newspapers ran them. Scheduled a few minutes off the
# hour and away from 00:00 UTC to dodge GitHub's cron jitter (peak-hour delays).
# 04.32 WIB = 21.32 UTC (previous day) · 16.32 WIB = 09.32 UTC
on:
  schedule:
    - cron: '32 21 * * *'
    - cron: '32 9 * * *'
  workflow_dispatch:

jobs:
  edisi:
    runs-on: ubuntu-latest
    # flip the NEWSROOM_ENABLED repo Variable to 'true' once the secrets are set
    if: ${{ vars.NEWSROOM_ENABLED == 'true' }}
    # contents: write — the run commits its slim arsip record (INGATAN REDAKSI,
    # §13.16): the repo itself is the memory the next edition diffs against
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r newsroom/requirements.txt
      - name: Run the pipeline
        env:
          # main model + free-tier fallbacks (keys in repo Secrets)
          NIM_API_KEY: ${{ secrets.NIM_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # publish target (Secret) + non-secret config (repo Variables)
          EDISI_TOKEN: ${{ secrets.EDISI_TOKEN }}
          MODEL_PRIMARY: ${{ vars.MODEL_PRIMARY }}
          NIM_BASE_URL: ${{ vars.NIM_BASE_URL }}
          AKSARA_URL: ${{ vars.AKSARA_URL }}
        run: python -m newsroom.main
      # the edition's slim record enters the repo: versioned, diffable,
      # citable memory. [skip ci] keeps archive commits from triggering a
      # site rebuild (the page reads memory from the KV payload, not arsip/)
      - name: Arsipkan edisi (INGATAN REDAKSI)
        run: |
          if [ -n "$(git status --porcelain arsip/)" ]; then
            git config user.name "newsroom[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add arsip/
            git commit -m "arsip: rekaman edisi untuk ingatan redaksi [skip ci]"
            git pull --rebase origin main || true
            git push || echo "arsip push gagal; rekaman tetap di artifact log"
          fi
      - name: Simpan log redaksi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsroom-log-${{ github.run_id }}
          path: newsroom/logs/*.jsonl
          if-no-files-found: ignore
