name = "detak-detik-worker"
main = "src/index.ts"
compatibility_date = "2026-06-01"

# hourly Lane A ticker refresh
[triggers]
crons = ["0 * * * *"]

# create with: wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
MODEL_PRIMARY = "qwen/qwen3.5-397b-a17b"
MODEL_FALLBACK = "nvidia/nemotron-3-ultra-550b-a55b"

# secret, never in code: wrangler secret put NIM_API_KEY  (nvapi-...)
